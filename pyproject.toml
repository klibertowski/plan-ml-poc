[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-ml-poc"
version = "0.1.0"
description = "Educational synthetic surgical-plan training and search mechanics"
requires-python = ">=3.11,<3.13"
dependencies = [
  "econml==0.16.0",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn==1.6.1",
  "xgboost>=2.1,<3.1",
  "matplotlib>=3.9,<4",
  "joblib>=1.4,<2",
  "jupyterlab>=4.3,<5",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<7",
]

[project.scripts]
plan-ml-poc = "plan_ml_poc.demo:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
